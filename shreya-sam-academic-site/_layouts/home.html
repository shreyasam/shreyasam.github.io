---
layout: default
---
{% assign profile = site.data.profile %}
<main id="main-content">
  <section class="hero">
    <div class="container hero__inner">
      <div class="hero__portrait">
        {% if profile.photo != "" %}
          <img src="{{ profile.photo | relative_url }}" alt="Portrait of {{ profile.name }}">
        {% else %}
          <div class="portrait-placeholder" role="img" aria-label="{{ profile.name }} initials">{{ profile.initials }}</div>
        {% endif %}
      </div>

      <div class="hero__content">
        <p class="hero__eyebrow">Academic profile</p>
        <h1>{{ profile.name }}</h1>
        <p class="hero__role">{{ profile.role }}</p>
        <p class="hero__affiliation">
          <a href="{{ profile.affiliation_url }}">{{ profile.affiliation }}</a> · {{ profile.location }}
        </p>
        <div class="hero__links">
          <a class="button button--light" href="{{ profile.cv_path | relative_url }}">Curriculum Vitae</a>
          <a class="button button--ghost" href="mailto:{{ profile.email }}">Email</a>
        </div>
      </div>
    </div>
  </section>

  <div class="container home-content">
    {{ content }}
  </div>
</main>
